# Development & test database ONLY. Credentials are throwaway and the port is bound to localhost.
services:
  postgres:
    image: postgres:16-alpine
    container_name: subtrack-postgres
    environment:
      POSTGRES_USER: subcycle
      POSTGRES_PASSWORD: subcycle
      POSTGRES_DB: subcycle
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - subcycle-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subcycle -d subcycle"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  subcycle-pgdata:
